<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>50張大地植物心靈牌卡桌</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d140f;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Serif TC", "Songti TC", serif;
    }

    /* 沉穩大地墨綠畫布 */
    #board {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1a2a1f 0%, #111d15 60%, #090e0b 100%);
      overflow: hidden;
    }

    #board::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(rgba(197, 160, 89, 0.12) 0.8px, transparent 0.8px),
        radial-gradient(rgba(110, 145, 120, 0.08) 1.2px, transparent 1.2px);
      background-size: 28px 28px, 42px 42px;
      pointer-events: none;
    }

    /* 桌面橫式牌卡 (154px × 100px) */
    .card {
      position: absolute;
      width: 154px;
      height: 100px;
      background: #faf6ee;
      border-radius: 9px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0,0,0,0.25);
      border: 1px solid #dcd1be;
      padding: 6px 7px;
      cursor: grab;
      will-change: transform;
      transition: box-shadow 0.18s ease;
    }

    .card.dragging {
      cursor: grabbing;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.7), 0 0 16px rgba(197, 160, 89, 0.4);
    }

    .card-border {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(168, 142, 97, 0.45);
      border-radius: 6px;
      padding: 5px 6px;
      display: flex;
      gap: 7px;
      align-items: center;
      pointer-events: none;
    }

    /* 左側植物極簡插圖 */
    .card-art-thumb {
      width: 44px;
      height: 100%;
      border-radius: 4px;
      background: #f1ede3;
      border: 1px solid rgba(190, 168, 130, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .card-art-thumb svg {
      width: 100%;
      height: 100%;
    }

    /* 右側文字資訊 */
    .card-info {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.5px;
      color: #72624e;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .card-snippet {
      font-size: 8.5px;
      line-height: 1.45;
      color: #404a41;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: auto 0;
    }

    .card-footer {
      font-size: 7.5px;
      color: #9d8357;
      text-align: right;
      letter-spacing: 1px;
    }

    /* 右上方浮動工具列 */
    .toolbar {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 99999;
    }

    .btn {
      background: rgba(19, 29, 22, 0.88);
      color: #e5dbc9;
      border: 1px solid rgba(197, 160, 89, 0.45);
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn.active {
      background: rgba(197, 160, 89, 0.3);
      border-color: #d8b76c;
      color: #fff4db;
    }

    .btn:active {
      transform: scale(0.94);
    }

    /* 牌卡總覽抽屜 Overlay 與面板 */
    #drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 8, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999999;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #drawer-overlay.show {
      display: block;
      opacity: 1;
    }

    #drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(85vw, 360px);
      height: 100vh;
      background: #18241b;
      border-left: 1px solid rgba(197, 160, 89, 0.3);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.7);
      z-index: 1000000;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      color: #f1ede3;
    }

    #drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(197, 160, 89, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-title {
      font-size: 14px;
      font-weight: 600;
      color: #dfcaa2;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .drawer-close {
      background: transparent;
      border: none;
      color: #b3a48e;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .drawer-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 14px 6px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(197, 160, 89, 0.15);
      -webkit-overflow-scrolling: touch;
    }

    .drawer-tabs::-webkit-scrollbar {
      display: none;
    }

    .drawer-tab {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(197, 160, 89, 0.25);
      border-radius: 14px;
      color: #b5a593;
      font-size: 11px;
      padding: 4px 10px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .drawer-tab.active {
      background: #c5a059;
      color: #121a14;
      font-weight: 700;
      border-color: #c5a059;
    }

    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      -webkit-overflow-scrolling: touch;
    }

    .drawer-item {
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(197, 160, 89, 0.16);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: center;
      transition: all 0.15s ease;
    }

    .drawer-item:hover, .drawer-item:active {
      background: rgba(197, 160, 89, 0.16);
      border-color: rgba(216, 183, 108, 0.5);
      transform: translateX(-2px);
    }

    .drawer-item-thumb {
      width: 28px;
      height: 28px;
      background: #233428;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .drawer-item-thumb svg {
      width: 100%;
      height: 100%;
    }

    .drawer-item-id {
      font-size: 11.5px;
      font-weight: 700;
      color: #d8b76c;
      width: 30px;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    .drawer-item-text {
      font-size: 12px;
      color: #dfd8cb;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* 橫向放大聚焦彈窗 (Focus View) */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 8, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000000;
      opacity: 0;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #modal.show {
      display: flex;
      opacity: 1;
    }

    .modal-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 95vw;
    }

    .modal-card {
      width: min(90vw, 560px);
      height: min(78vh, 290px);
      background: #fcf9f2;
      border-radius: 16px;
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.88), 0 0 26px rgba(197, 160, 89, 0.3);
      border: 2px solid #e1d5c2;
      padding: 16px 18px;
      transform: scale(0.88);
      transition: transform 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.25);
    }

    #modal.show .modal-card {
      transform: scale(1);
    }

    .modal-border {
      width: 100%;
      height: 100%;
      border: 1.5px solid #c9b48c;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .modal-art-box {
      width: 145px;
      height: 100%;
      background: #f4efe5;
      border-radius: 8px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
    }

    .modal-art-box svg {
      width: 100%;
      height: 100%;
    }

    .modal-content {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px dashed #d9cbba;
      padding-bottom: 8px;
    }

    .modal-id {
      font-size: 13px;
      color: #8c765a;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .modal-star {
      font-size: 11px;
      color: #9d8357;
      letter-spacing: 2px;
    }

    .modal-text {
      font-size: 16px;
      line-height: 1.95;
      color: #2e3831;
      text-align: justify;
      margin: auto 0;
      padding: 10px 4px;
      letter-spacing: 0.4px;
    }

    .modal-footer {
      font-size: 10px;
      color: #b1986e;
      letter-spacing: 2px;
      text-align: right;
      padding-top: 6px;
    }

    .modal-close-tip {
      text-align: center;
      color: #d1c5b0;
      font-size: 12px;
      margin-top: 13px;
      letter-spacing: 0.8px;
    }

    /* 手機直向模式轉向提醒 */
    #rotate-tip {
      position: fixed;
      inset: 0;
      background: #0f1612;
      color: #d4b87d;
      z-index: 2000000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 15px;
      padding: 24px;
      text-align: center;
    }

    @media (orientation: portrait) {
      #rotate-tip.active {
        display: flex;
      }
    }

    .tip-bypass-btn {
      margin-top: 10px;
      background: rgba(197, 160, 89, 0.2);
      border: 1px solid #c5a059;
      color: #f1ede3;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 手機直向模式提示 -->
  <div id="rotate-tip" class="active">
    <div style="font-size: 34px;">🌿</div>
    <div>建議將裝置旋轉為「橫向模式」<br>獲得最開闊舒暢的牌卡桌面</div>
    <button class="tip-bypass-btn" id="btn-bypass-tip">直接進入體驗 ➔</button>
  </div>

  <!-- 桌面主畫布 -->
  <div id="board"></div>

  <!-- 工具列 -->
  <div class="toolbar">
    <button class="btn" id="btn-ambient"><span>🎵</span> 抒情輕音樂</button>
    <button class="btn" id="btn-drawer"><span>📜</span> 牌卡總覽</button>
    <button class="btn" id="btn-gather">收攏</button>
    <button class="btn" id="btn-scatter">重新散落</button>
  </div>

  <!-- 側邊選牌抽屜 -->
  <div id="drawer-overlay"></div>
  <div id="drawer">
    <div class="drawer-header">
      <div class="drawer-title"><span>📜</span> 牌卡總覽 ✦ 輕觸選牌</div>
      <button class="drawer-close" id="btn-close-drawer">✕</button>
    </div>
    <div class="drawer-tabs">
      <button class="drawer-tab active" data-group="ALL">全部 (50)</button>
      <button class="drawer-tab" data-group="A">A 系列</button>
      <button class="drawer-tab" data-group="B">B 系列</button>
      <button class="drawer-tab" data-group="C">C 系列</button>
      <button class="drawer-tab" data-group="D">D 系列</button>
      <button class="drawer-tab" data-group="E">E 系列</button>
    </div>
    <div class="drawer-list" id="drawer-list"></div>
  </div>

  <!-- 橫向放大聚焦彈窗 -->
  <div id="modal">
    <div class="modal-box">
      <div class="modal-card">
        <div class="modal-border">
          <div class="modal-art-box" id="m-art"></div>
          <div class="modal-content">
            <div class="modal-top">
              <span class="modal-id" id="m-id">A01</span>
              <span class="modal-star">✦ ✦ ✦</span>
            </div>
            <div class="modal-text" id="m-text">牌卡內文文字載入中...</div>
            <div class="modal-footer">✦ WISDOM OF NATURE</div>
          </div>
        </div>
      </div>
      <div class="modal-close-tip">點擊任意空白處收回桌面</div>
    </div>
  </div>

  <script>
    /* =====================================================================
       1. 純 Web Audio API 聲學合成器
       ===================================================================== */
    const AudioEngine = {
      ctx: null,
      isMusicPlaying: false,
      musicTimer: null,
      musicStep: 0,
      isUnlocked: false,

      // 行動裝置專屬：同步強制解鎖音訊通道
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        // iOS 關鍵：播放一段 0.01 秒無聲音訊徹底喚醒 AudioContext
        if (this.ctx && !this.isUnlocked) {
          try {
            const buffer = this.ctx.createBuffer(1, 1, 22050);
            const source = this.ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(this.ctx.destination);
            source.start(0);
            this.isUnlocked = true;
          } catch (e) {}
        }
      },

      // 紙牌滑動摩擦聲
      playPaperRustle(intensity = 1.0) {
        if (!this.ctx) return;
        try {
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.12);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1600 + Math.random() * 400;
          filter.Q.value = 1.2;

          const gain = this.ctx.createGain();
          const vol = Math.min(0.22 * intensity, 0.4);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start();
        } catch (e) {}
      },

      // 牌卡落地輕響
      playCardDrop() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.08);

          gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.09);
        } catch (e) {}
      },

      // 溫潤木吉他/八音盒撥弦音色合成器
      playPluckTone(freq, duration = 1.2, volume = 0.08, delay = 0) {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          
          // 敲擊瞬間的清脆金屬敲擊泛音 (Transient strike attack)
          const strikeFreqs = [1850, 2760, 3920];
          strikeFreqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            const strikeVol = [0.18, 0.10, 0.05][idx];
            gain.gain.setValueAtTime(strikeVol, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
          });

          // 缽身沉穩悠遠的核心共鳴 (Resonant Body & Overtones)
          // 基準缽音約 640Hz (E5 清澈高雅基音)，配合長延音與多重諧波
          const bowlPartials = [
            { freq: 640, vol: 0.24, dur: 3.2 },
            { freq: 1285, vol: 0.14, dur: 2.8 },
            { freq: 1940, vol: 0.08, dur: 2.2 },
            { freq: 3210, vol: 0.04, dur: 1.5 }
          ];

          bowlPartials.forEach(p => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(p.freq, now);

            // 敲擊時瞬間到達峰值，再以指數漸弱長延音
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(p.vol, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + p.dur);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + p.dur + 0.05);
          });
        } catch (e) {}
      },

      // 溫潤琴音音色生成器 (溫暖鋼琴/八音盒質感)
      playInstrumentNote(freq, duration = 1.2, volume = 0.15) {
        if (!this.ctx || !freq) return;
        try {
          const now = this.ctx.currentTime;
          
          // 雙振盪器模擬豐富諧波
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq * 2, now); // 高八度泛音

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(freq * 3.5, now);
          filter.frequency.exponentialRampToValueAtTime(freq * 0.8, now + duration);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          const subGain = this.ctx.createGain();
          subGain.gain.value = 0.25;
          osc2.connect(subGain);
          subGain.connect(filter);
          osc1.connect(filter);

          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + duration + 0.05);
          osc2.stop(now + duration + 0.05);
        } catch (e) {}
      },

      // 完整的抒情輕音樂樂章 (包含引子、主歌抒情句、高潮副歌與柔和收尾)
      toggleAmbient(btn) {
        this.init();
        if (this.isMusicPlaying) {
          if (this.musicTimer) {
            clearTimeout(this.musicTimer);
            this.musicTimer = null;
          }
          this.isMusicPlaying = false;
          btn.classList.remove('active');
        } else {
          this.isMusicPlaying = true;
          btn.classList.add('active');
          this.musicStep = 0;

          // 音符頻率表 (標準十二平均律)
          const N = {
            C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
            C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
            C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
            C6: 1046.50
          };

          // 完整的抒情輕音樂曲譜 (伴奏與抒情主旋律，包含 A段、B段、柔和沉澱)
          const SONG_TRACK = [
            // [節拍長度(ms), 主旋律, 伴奏音, 低音根音]

    /* =====================================================================
       4. 桌面互動與物理系統
       ===================================================================== */
    const board = document.getElementById('board');
    const modal = document.getElementById('modal');
    let maxZIndex = 100;
    const cardElements = [];

    const CARD_W = 154;
    const CARD_H = 100;

    // 建立 50 張桌面卡片
    CARDS.forEach((data) => {
      const card = document.createElement('div');
      card.className = 'card';
      const artSvg = ArtStyles[data.artIndex]();

      card.innerHTML = `
        <div class="card-border">

          </div>

      `;

        el: card,
        data: data,
        x: 0,
        y: 0,
        angle: 0,
        vx: 0,
        vy: 0,

    // 隨機散落
    function scatterCards() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      cardElements.forEach((c) => {
        c.x = Math.random() * (w - CARD_W - 32) + 16;
        c.y = Math.random() * (h - CARD_H - 32) + 16;
        c.angle = (Math.random() - 0.5) * 32;
        c.vx = 0;
        c.vy = 0;
        updateTransform(c);
      });
    }

    // 整齊收攏
    function gatherCards() {
      AudioEngine.init();
      AudioEngine.playPaperRustle(1.4);
      const cx = (window.innerWidth - CARD_W) / 2;
      const cy = (window.innerHeight - CARD_H) / 2;
      cardElements.forEach((c, idx) => {
        c.x = cx + (Math.random() - 0.5) * 10;
        c.y = cy + (Math.random() - 0.5) * 10;
        c.angle = (Math.random() - 0.5) * 6;
        c.vx = 0;
        c.vy = 0;
        c.el.style.zIndex = idx + 1;
        updateTransform(c);
      });
      maxZIndex = cardElements.length + 10;
    }

    function updateTransform(c) {
      c.el.style.transform = `translate3d(${c.x}px, ${c.y}px, 0) rotate(${c.angle}deg)`;
    }

    // 拖曳與滑動撥牌
    function setupCardInteraction(c) {
      let startPointerX = 0, startPointerY = 0;
      let startCardX = 0, startCardY = 0;
      let lastMoveTime = 0;
      let lastMoveX = 0, lastMoveY = 0;
      let isMoved = false;

      function onPointerDown(e) {
        if (e.target.closest('.toolbar') || modal.classList.contains('show') || drawer.classList.contains('open')) return;
        AudioEngine.init();

        c.isDragging = true;
        c.vx = 0;
        c.vy = 0;
        c.el.classList.add('dragging');
        c.el.style.zIndex = ++maxZIndex;

        AudioEngine.playPaperRustle(0.9);

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        startPointerX = clientX;
        startPointerY = clientY;
        lastMoveX = clientX;
        lastMoveY = clientY;
        startCardX = c.x;
        startCardY = c.y;
        lastMoveTime = performance.now();
        isMoved = false;

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
      }

      function onPointerMove(e) {
        if (!c.isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const dx = clientX - startPointerX;
        const dy = clientY - startPointerY;

        if (Math.hypot(dx, dy) > 6) {
          isMoved = true;
        }

        c.x = startCardX + dx;
        c.y = startCardY + dy;
        updateTransform(c);

        const now = performance.now();
        const dt = now - lastMoveTime;
        if (dt > 12) {
          c.vx = (clientX - lastMoveX) / dt * 14;
          c.vy = (clientY - lastMoveY) / dt * 14;
          lastMoveX = clientX;
          lastMoveY = clientY;
          lastMoveTime = now;
        }
      }

      function onPointerUp() {
        if (!c.isDragging) return;
        c.isDragging = false;
        c.el.classList.remove('dragging');

        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerUp);

        if (!isMoved) {
          openModal(c.data);
          return;
        }

        AudioEngine.playPaperRustle(0.7);
        runInertia(c);
      }

      c.el.addEventListener('pointerdown', onPointerDown);
    }

    function runInertia(c) {
      function step() {
        if (c.isDragging) return;
        c.vx *= 0.90;
        c.vy *= 0.90;
        c.x += c.vx;
        c.y += c.vy;

        const maxW = window.innerWidth - CARD_W;
        const maxH = window.innerHeight - CARD_H;
        let bounced = false;

        if (c.x < 10) { c.x = 10; c.vx *= -0.45; bounced = true; }
        if (c.x > maxW) { c.x = maxW; c.vx *= -0.45; bounced = true; }
        if (c.y < 10) { c.y = 10; c.vy *= -0.45; bounced = true; }
        if (c.y > maxH) { c.y = maxH; c.vy *= -0.45; bounced = true; }

        if (bounced && (Math.abs(c.vx) > 1.2 || Math.abs(c.vy) > 1.2)) {
          AudioEngine.playCardDrop();
        }

        updateTransform(c);

        if (Math.abs(c.vx) > 0.3 || Math.abs(c.vy) > 0.3) {
          requestAnimationFrame(step);
        } else {
          AudioEngine.playCardDrop();
        }
      }
      requestAnimationFrame(step);
    }

    document.querySelectorAll('.drawer-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
        e.currentTarget.classList.add('active');
        currentFilterGroup = e.currentTarget.dataset.group;
        renderDrawerItems(currentFilterGroup);
      });
    });

    function openDrawer() {
      AudioEngine.init();
      AudioEngine.playPaperRustle(0.9);
      renderDrawerItems(currentFilterGroup);
      drawerOverlay.classList.add('show');
      drawer.classList.add('open');
    }

    function closeDrawer() {
      drawerOverlay.classList.remove('show');
      drawer.classList.remove('open');
    }

    document.getElementById('btn-drawer').addEventListener('click', openDrawer);
    document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // 關閉直向提示
    const rotateTip = document.getElementById('rotate-tip');
    const bypassBtn = document.getElementById('btn-bypass-tip');
    if (bypassBtn) {
      bypassBtn.addEventListener('click', () => {
        rotateTip.classList.remove('active');
        scatterCards();
      });
    }

    // 工具列按鈕
    const ambientBtn = document.getElementById('btn-ambient');
    const handleMusicToggle = (e) => {
      if (e) e.stopPropagation();
      AudioEngine.init();
      AudioEngine.toggleAmbient(ambientBtn);
    };

    ambientBtn.addEventListener('click', handleMusicToggle);
    ambientBtn.addEventListener('touchend', (e) => {
      // 避免 touch 與 click 雙重觸發
      e.preventDefault();
      handleMusicToggle(e);
    });

    // 全域監聽第一次使用者互動，提前喚醒行動端音訊
    const unlockAudioGlobal = () => {
      AudioEngine.init();
      window.removeEventListener('touchstart', unlockAudioGlobal);
      window.removeEventListener('pointerdown', unlockAudioGlobal);
      window.removeEventListener('click', unlockAudioGlobal);
    };
    window.addEventListener('touchstart', unlockAudioGlobal, { passive: true });
    window.addEventListener('pointerdown', unlockAudioGlobal, { passive: true });
    window.addEventListener('click', unlockAudioGlobal, { passive: true });

    document.getElementById('btn-scatter').addEventListener('click', () => {
      AudioEngine.init();
      AudioEngine.playPaperRustle(1.2);
      scatterCards();
    });

    document.getElementById('btn-gather').addEventListener('click', gatherCards);

    window.addEventListener('resize', () => {
      scatterCards();
    });

    // 初次載入
    setTimeout(scatterCards, 120);
  </script>
</body>
</html>
